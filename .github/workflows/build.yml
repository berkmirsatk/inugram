name: repository-regression-tests

on:
  workflow_dispatch:
  push:
    branches:
      - test/rich-plugin-repositories-beta

permissions:
  contents: read

concurrency:
  group: repository-regression-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: configure build identity
        run: |
          git config --global user.email ci@inugram
          git config --global user.name 'inugram ci'

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: install libclang
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libclang-dev

      - name: cache Rust dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/native/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src/native/Cargo.lock', 'src/native/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: install Android Rust tools
        working-directory: src/native
        run: |
          rustup toolchain install
          cargo install cargo-ndk --version 4.1.2 --locked

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: 21

      - name: cache native compilation
        uses: hendrikmuhs/ccache-action@e42e6681d2906409c5dde4a315af6214eaa890ee
        with:
          append-timestamp: true
          key: ${{ runner.os }}-ndk-27.2-debug-full
          restore-keys: |
            ${{ runner.os }}-ndk-27.2-debug-full
            ${{ runner.os }}-ndk-27.2-release-full
          max-size: 5G

      - name: prepare full worktree
        run: pnpm run setup -- --ci

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-home-cache-cleanup: true
          cache-read-only: false

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: >-
            platforms;android-36
            build-tools;36.0.0
            cmake;3.31.6
            ndk;27.2.12479018
            ndk;29.0.14206865

      - name: configure Gradle
        run: |
          cat >> ~/.gradle/gradle.properties <<'PROPERTIES'
          org.gradle.caching=true
          org.gradle.workers.max=2
          org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
          kotlin.compiler.execution.strategy=in-process
          PROPERTIES

      - name: build Android test APK
        working-directory: worktree
        env:
          CCACHE_COMPILERCHECK: content
          CCACHE_SLOPPINESS: time_macros,file_macro,include_file_mtime,include_file_ctime,locale,system_headers
          CCACHE_BASEDIR: ${{ github.workspace }}/worktree
        run: ./gradlew --no-daemon :TMessagesProj:assembleDebugAndroidTest

      - name: enable KVM for disposable emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Google APIs Android 11 supports ARM translation on x86 hosts. The script
      # verifies arm64-v8a is advertised before installing or running the tests.
      - name: run seven repository regression tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/ci/test-plugin-repos.sh

      - name: upload device test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repository-device-test-reports
          path: |
            out/device-tests
            worktree/TMessagesProj/build/outputs/androidTest-results
            worktree/TMessagesProj/build/reports/androidTests
          if-no-files-found: warn
          retention-days: 7
